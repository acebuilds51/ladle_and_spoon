<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lia's practice · Ladle &amp; Spoon</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!--
  Lia's lessons (gs101, Tony 2026-10-06). Short self-guided practice for each task, emailed the day
  before she does it. Every screen here is pretend: made-up customers, and nothing is sent anywhere
  except her lesson result (which lesson, how it felt, what she typed) to Apps Script, which records
  it in "Lia's lessons" and emails Tony. ?d=YYYY-MM-DD puts that day's lessons first; ?preview sends
  nothing (for Tony to try it). No customer data belongs in this file: the repository is public.
-->
<style>
:root{--f:#1B3D1C;--fm:#2E6B30;--sg:#7FAF6E;--sgl:#C4DDB8;--cr:#F8F4EC;--cl:#C4622D;--am:#D4943A;--tx:#1A1A18;--t2:#4A4A45;--t3:#8A8A80;--bd:#E8E0D0;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cr);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
.top{background:var(--f);color:#fff;padding:16px;text-align:center}
.top h1{font-family:'Cormorant Garamond',serif;font-size:28px;margin:0;line-height:1.1}
.top p{margin:4px 0 0;font-size:14px;opacity:.85}
.pv{background:#fff3cd;color:#7a5a00;text-align:center;font-size:13px;padding:6px}
.day{margin:20px 0 6px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t3)}
.day.now{color:var(--cl)}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:8px 0;cursor:pointer;font-size:17px;color:var(--tx)}
.tile .ic{font-size:26px;width:34px;text-align:center}
.tile .t{flex:1;font-weight:700;line-height:1.3}
.tile .m{display:block;font-weight:400;font-size:13px;color:var(--t3)}
.tile.done{border-color:var(--sgl);background:#f6fbf3}
.big{display:block;width:100%;border:none;border-radius:14px;background:var(--f);color:#fff;font-size:19px;font-weight:700;padding:16px;cursor:pointer;margin:12px 0}
.big.alt{background:#fff;color:var(--f);border:2px solid var(--f)}
.link{background:none;border:none;color:var(--t3);text-decoration:underline;font-size:15px;cursor:pointer;padding:8px}
/* lesson */
.bar{display:flex;align-items:center;gap:10px;padding:12px 0}
.bar .x{background:#fff;border:1.5px solid var(--bd);border-radius:10px;font-size:15px;padding:6px 12px;cursor:pointer}
.dots{flex:1;height:8px;background:#e6dfd0;border-radius:4px;overflow:hidden}
.dots i{display:block;height:100%;background:var(--sg);transition:width .3s}
.say{font-size:20px;line-height:1.45;margin:6px 0 14px}
.say b{color:var(--f)}
.hint{font-size:15px;color:var(--cl);font-weight:700;min-height:22px;margin:-6px 0 8px}
/* the pretend phone screen */
.scr{background:#fff;border:1.5px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06);font-size:15px}
.scr .lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--t3);text-align:center;padding:6px;background:#faf8f3;border-bottom:1px solid var(--bd)}
.pad{padding:14px}
.ah{background:var(--f);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
.ah .logo{width:40px;height:40px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#f3efe6}
.tabs span{white-space:nowrap;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:5px 10px;font-size:13px;cursor:pointer}
.tabs span.on{background:var(--f);color:#fff;border-color:var(--f)}
.btn{display:block;width:100%;text-align:center;border:none;border-radius:12px;background:var(--f);color:#fff;font-weight:700;font-size:16px;padding:13px;margin:8px 0;cursor:pointer}
.btn.out{background:#fff;color:var(--f);border:1.5px solid var(--f)}
.btn.red{background:#9a3412}
.btn.gry{background:#888}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:4px 6px 4px 0}
.card{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0;background:#fff}
.mail .from{font-size:12px;color:var(--t3)}
.mail .sub{font-weight:700;font-size:16px;margin:2px 0 8px;color:var(--tx)}
.quote{background:var(--cr);border-radius:8px;padding:10px;font-size:14px;white-space:pre-wrap}
.msgs{background:#f2f2f7;padding:14px;min-height:170px}
.msgs .to{text-align:center;font-size:13px;color:#666;margin-bottom:10px}
.bub{background:#0a84ff;color:#fff;border-radius:16px;padding:9px 12px;margin-left:auto;max-width:85%;font-size:14px}
.compose{display:flex;gap:8px;align-items:flex-end;padding:10px;background:#fff;border-top:1px solid #ddd}
.compose .in{flex:1;border:1px solid #ccc;border-radius:16px;padding:8px 12px;font-size:14px;color:#333;min-height:36px}
.compose .send{width:38px;height:38px;border-radius:50%;background:#0a84ff;color:#fff;border:none;font-size:20px;cursor:pointer}
.fb{background:#f0f2f5}
.fb .gh{background:#1877f2;color:#fff;padding:10px 14px;font-weight:700}
.stop{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ece2}
.stop .n{width:30px;height:30px;border-radius:50%;background:var(--f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.stop .i{flex:1;min-width:0;font-size:14px;line-height:1.35}
.stop .i span{display:block;color:var(--t3);font-size:12px}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:40px;height:32px;border-radius:8px;border:1.5px solid var(--f);background:#fff;color:var(--f);font-size:14px;cursor:pointer}
.mv button:disabled{opacity:.3}
.warn{background:#fff7e0;border:1px solid #f1d38a;border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.pay{border-radius:10px;padding:10px;font-weight:700;margin:8px 0}
.dvn{font-size:22px;font-weight:700;color:var(--f)}
.ok{color:#15803d;font-weight:700}
/* the button to tap */
.glow{position:relative;animation:glow 1.3s ease-in-out infinite;outline:3px solid var(--am);outline-offset:2px}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(212,148,58,.7)}50%{box-shadow:0 0 0 9px rgba(212,148,58,0)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* quiz */
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0;font-size:17px;cursor:pointer;color:var(--tx)}
.opt.right{border-color:#15803d;background:#effaf1}
.opt.wrong{border-color:#c2410c;background:#fff4ed}
.why{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:16px}
.why.g{background:#effaf1;color:#14532d}
.why.b{background:#fff4ed;color:#7c2d12}
.feel{display:flex;gap:10px;margin:10px 0}
.feel button{flex:1;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:12px 4px;font-size:15px;cursor:pointer}
.feel button b{display:block;font-size:34px}
.feel button.on{border-color:var(--f);background:#f0f7ec}
textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:12px;font-size:17px;font-family:inherit;min-height:96px}
.rd{font-size:15px;margin:4px 0}
@media (prefers-reduced-motion:reduce){.glow{animation:none}}
</style>
</head>
<body>
<div class="top"><h1>Lia&rsquo;s practice</h1><p>Short lessons for what&rsquo;s coming up</p></div>
<div id="pv"></div>
<div class="wrap" id="app"></div>
<script>
'use strict';
var API = 'https://ladle-spoon-api.ladle-spoon-api.workers.dev/';
var Q = new URLSearchParams(location.search), PREVIEW = Q.has('preview'), DAY = Q.get('d') || '';
// The same schedule as LEARN_DAYS in the backend: each day's lessons, for the task the day after.
var DAYS = [
  { date: '2026-10-07', label: 'For Thursday', lessons: ['helper', 'facebook'] },
  { date: '2026-10-08', label: 'For Friday',   lessons: ['texts', 'lastcall', 'approve'] },
  { date: '2026-10-11', label: 'For Monday',   lessons: ['route1', 'route2', 'receipts'] },
  { date: '2026-10-12', label: 'For Tuesday',  lessons: ['publish'] }
];
function store(k, v){ try{ if(v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }
var DONE = store('learn_done') || {};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ── Pretend screens ──
function scr(inner, label){ return '<div class="scr" id="scr"><div class="lbl">' + (label || 'Practice screen · nothing is sent') + '</div>' + inner + '</div>'; }
function adminTop(tab){
  var tabs = ['📊 Dash', '📋 Orders', '🚗 Route', '🍲 Menu', '🎁 Gift', '💌 Re-engage'];
  return '<div class="ah"><span>Ladle &amp; Spoon · Admin</span></div><div class="tabs">'
    + tabs.map(function(t){ var id = t.split(' ')[1].toLowerCase().replace(/\W/g, ''); return '<span data-t="tab-' + id + '" class="' + (t.indexOf(tab) >= 0 ? 'on' : '') + '">' + t + '</span>'; }).join('') + '</div>';
}
function mail(from, subject, body){ return '<div class="pad mail"><div class="from">From: ' + from + '</div><div class="sub">' + subject + '</div>' + body + '</div>'; }
function messages(to, text, sent){
  return '<div class="msgs"><div class="to">To: ' + to + '</div>' + (sent ? '<div class="bub">' + esc(text) + '</div><div style="text-align:right;font-size:11px;color:#888;margin-top:4px">Delivered</div>' : '') + '</div>'
    + (sent ? '<div class="pad"><button class="btn" data-t="back">← Back to the Ladle &amp; Spoon app</button></div>'
            : '<div class="compose"><div class="in">' + esc(text) + '</div><button class="send" data-t="send" aria-label="Send">↑</button></div>');
}
var MARY = 'Hi Mary! It\'s Lia from Ladle & Spoon. Orders close tonight at 7 PM for Monday delivery. This week: Pasta E Fagioli, Chicken Stroganoff and a Crispy Pepperoni Salad. Order here: ladleandspoon…';
var TOM = MARY.replace('Mary', 'Tom');
var BUMP = 'Last call! Orders close at 7 PM tonight for Monday delivery 🥣';
function textsCard(sent){
  var ppl = ['Mary Sample', 'Tom Example', 'Rita Demo'], next = ppl[sent];
  return adminTop('Dash') + '<div class="pad"><b>📱 Friday texts</b><div style="font-size:13px;color:var(--t3);margin:4px 0 8px">Tap the green button, tap <b>Send</b> in Messages, then come back.</div>'
    + '<div style="font-size:13px;font-weight:700">' + sent + ' of 3 sent</div><div style="height:6px;background:#eee;border-radius:3px;margin:4px 0 10px"><div style="height:100%;width:' + Math.round(sent / 3 * 100) + '%;background:var(--f);border-radius:3px"></div></div>'
    + (next ? '<button class="btn" data-t="textnext">💬 Text next: ' + next + '</button>' : '<div class="ok" style="text-align:center">All 3 sent. Thank you!</div>')
    + ppl.map(function(p, i){ return '<div class="stop"><div class="i"><b>' + p + '</b><span>(248) 555-01' + (10 + i) + '</span></div>' + (i < sent ? '<span class="ok">Sent ✓</span>' : '<button class="btn sm out" data-t="stop-' + i + '">Stop</button>') + '</div>'; }).join('')
    + '</div>';
}
var STOPS0 = [['Mary Sample', '412 Maple Ave, Waterford', 'Cash $30'], ['Tom Example', '88 Lakeview Dr, Waterford', 'Venmo $23'], ['Rita Demo', '1530 Cass Lake Rd, Keego Harbor', 'Cash $30'],
  ['Joe Placeholder', '7 Oak Hollow Ct, Waterford', 'Venmo $15'], ['Ann Testing', '22 Pine St, Waterford', 'Venmo $16']];
function routeList(stops, moved){
  return adminTop('Route') + '<div class="pad"><div style="display:flex;gap:16px;font-size:13px;color:var(--t2)"><div><b style="font-size:22px;color:var(--f)">5</b> stops</div><div><b style="font-size:22px;color:var(--f)">52 min</b> driving</div><div><b style="font-size:22px;color:var(--f)">14 mi</b></div></div>'
    + '<button class="btn" data-t="start">▶ Start delivering</button>'
    + (moved ? '<button class="btn out" data-t="update">Update drive times for my order</button>' : '')
    + '<div style="font-size:12px;color:var(--t3);margin-top:8px">Use ▲ ▼ to move a stop (for example someone who needs it early).</div>'
    + stops.map(function(s, i){ return '<div class="stop"><div class="n">' + (i + 1) + '</div><div class="i"><b>' + s[0] + '</b><span>' + s[1] + '</span></div><div class="mv"><button data-mv="' + i + ',-1"' + (i ? '' : ' disabled') + '>▲</button><button data-mv="' + i + ',1"' + (i < stops.length - 1 ? '' : ' disabled') + '>▼</button></div></div>'; }).join('')
    + '<div style="text-align:center"><button class="link" style="color:var(--f)">' + (moved ? 'Back to the best order' : 'Plan again (new orders?)') + '</button></div></div>';
}
function driveStop(n, s, armed){
  return '<div class="pad"><div style="display:flex;justify-content:space-between;font-weight:700;color:var(--t2)"><span>Stop ' + n + ' of 5</span><span style="border:1.5px solid var(--bd);border-radius:9px;padding:2px 10px" data-t="close">✕ Close</span></div>'
    + '<div class="dvn" style="margin-top:8px">' + s[0] + '</div><div>' + s[1] + '</div>'
    + (n === 1 ? '<div class="warn">📝 Leave on the porch. Dog in the yard.</div>' : '')
    + '<div class="card">📦 Pasta E Fagioli (Quart), Crispy Pepperoni Salad</div>'
    + '<div class="pay" style="' + (/Cash/.test(s[2]) ? 'background:#fef3c7;color:#92400e">💵 Collect ' + s[2].slice(5) + ' cash' : 'background:#e8f4ff;color:#0b5cad">💙 Venmo · ' + s[2].slice(6)) + '</div>'
    + '<button class="btn" style="background:#2563eb" data-t="nav">🧭 Navigate</button>'
    + '<div style="display:flex;gap:8px"><button class="btn out" style="flex:1">📞 Call</button><button class="btn out" style="flex:1">💬 Text</button></div>'
    + '<button class="btn" style="padding:18px;font-size:18px;' + (armed ? 'background:#14532d' : '') + '" data-t="' + (armed ? 'confirm' : 'delivered') + '">' + (armed ? 'Tap again to confirm' : '✓ Delivered') + '</button>'
    + '<div style="display:flex;justify-content:space-between"><button class="link" data-t="skip">Skip for now</button><span style="font-size:12px;color:var(--t3);align-self:center">🚗 6 min from the last stop</span></div></div>';
}
function textsPhase(tapped){
  return '<div class="pad"><div class="ok" style="margin-bottom:10px">✓ Mary Sample delivered. The invoice is on its way.</div><div style="font-size:14px;color:var(--t2);margin-bottom:6px">Tap each one, then Send in Messages:</div>'
    + '<button class="btn out" data-t="tdone" style="' + (tapped > 0 ? 'opacity:.6' : '') + '">' + (tapped > 0 ? '✓ ' : '💬 ') + 'Text Mary: "delivered"</button>'
    + '<button class="btn out" data-t="tnext" style="' + (tapped > 1 ? 'opacity:.6' : '') + '">' + (tapped > 1 ? '✓ ' : '💬 ') + 'Text Tom: "you\'re my next stop"</button>'
    + '<button class="btn" style="background:#2563eb" data-t="navnext">🧭 Navigate to Tom</button></div>';
}
function maps(to){ return '<div style="background:#e8f0e3;height:150px;display:flex;align-items:center;justify-content:center;font-size:40px">🗺️</div><div class="pad"><b>Google Maps</b><div>Driving to ' + to + '… 6 min</div><button class="btn" data-t="back">I&rsquo;m there: back to the Ladle &amp; Spoon app</button></div>'; }
function confirmPage(title, text, yes, cls){ return '<div class="pad" style="text-align:center;background:var(--cr)"><div class="card"><h3 style="color:var(--f);margin:4px 0">' + title + '</h3><p style="color:#555">' + text + '</p>' + (yes ? '<button class="btn ' + (cls || '') + '" data-t="yes">' + yes + '</button>' : '') + '</div></div>'; }

// ── The receipts reply, read the way the app reads it (a simple copy of parseCostReply's rules) ──
function readReply(text){
  var out = [], kinds = [[/^(groceries|grocery|food)\b/i, 'Groceries'], [/^(containers?|packaging|lids?|labels?|bags?|supplies)\b/i, 'Containers & packaging'],
    [/^(gift ?box(es)?|gift|cards?|ribbon)\b/i, 'Gift box & cards'], [/^(other|misc\w*)\b/i, 'Other']];
  text.split('\n').forEach(function(l){
    var line = l.trim(); if(!line) return;
    if(/^(none|nothing)\b/i.test(line)){ out.push({ ok: true, t: 'Nothing bought this time' }); return; }
    var mm = /^(?:(?:shopping|store|grocery|supply)\s+)?(?:miles?|mileage)\b[\s:=-]*([\d.]+)/i.exec(line);
    if(mm){ out.push({ ok: true, t: 'Shopping miles: ' + mm[1] + ' mi' }); return; }
    if(/\bgas\b/i.test(line)){ out.push({ ok: false, t: '“' + line + '”: leave gas out. Your miles already cover it.' }); return; }
    var kind = 'Groceries', rest = line;
    for(var i = 0; i < kinds.length; i++){ var k = kinds[i][0].exec(line); if(k){ kind = kinds[i][1]; rest = line.slice(k[0].length); break; } }
    var a = /\$?\s*(\d{1,4}(?:\.\d{1,2})?)/.exec(rest);
    if(a) out.push({ ok: true, t: kind + ': $' + parseFloat(a[1]).toFixed(2) });
    else out.push({ ok: false, t: '“' + line + '”: I couldn’t find an amount. Try “Groceries 182.40”.' });
  });
  return out;
}

// ── Lessons ──
// Each step: say (what to do), screen (the pretend screen), tap (the button that moves on; it glows),
// next (a Next button instead), quiz, or run (its own little practice).
var L = {
helper: { icon: '🔑', title: 'Getting into Admin, and your helper', mins: 2, steps: [
  { say: 'To get into Admin, you tap the Ladle &amp; Spoon <b>logo 5 times</b>. Try it: tap the glowing logo 5 times.',
    screen: function(st){ return '<div class="ah"><button class="logo" data-t="logo">🥣</button><span>Ladle &amp; Spoon</span></div><div class="pad" style="color:var(--t3)">Homemade soups &amp; salads…<div style="margin-top:8px;font-weight:700;color:var(--f)">' + (st.n ? 'Taps: ' + st.n + ' of 5' : '') + '</div></div>'; },
    tap: 'logo', times: 5 },
  { say: 'Next it asks for your PIN. In the real app you type it in. Here it&rsquo;s pretend, so just tap <b>Enter</b>.',
    screen: '<div class="pad" style="text-align:center"><b>Admin PIN</b><div style="font-size:26px;letter-spacing:8px;margin:10px 0">••••</div><button class="btn" data-t="enter">Enter</button></div>', tap: 'enter' },
  { say: 'You&rsquo;re in! The tabs along the top take you to each part. Tap <b>🚗 Route</b>.',
    screen: adminTop('Dash') + '<div class="pad" style="color:var(--t3)">This week: 42 orders…</div>', tap: 'tab-route' },
  { say: 'Stuck on anything, any time? Tap the green <b>❓ Ask a question</b> button at the bottom of Admin. Try it.',
    screen: adminTop('Route') + '<div class="pad" style="height:120px;position:relative"><button class="btn" data-t="ask" style="position:absolute;right:12px;bottom:4px;width:auto;border-radius:24px;padding:10px 16px">❓ Ask a question</button></div>', tap: 'ask' },
  { say: 'Type your question in your own words. It answers from your user manual, any time of day.',
    screen: '<div class="pad"><b style="color:var(--f)">Ask a question</b><div class="quote" style="margin:8px 0;background:#e8f4ff">How do I move a stop earlier?</div><div class="quote">On the Route tab, tap ▲ next to their name until they&rsquo;re near the top, then tap &ldquo;Update drive times for my order&rdquo;.</div></div>', next: true },
  { quiz: 'You can&rsquo;t remember how to do something in the app. What&rsquo;s the quickest help?', opts: [
    ['Tap ❓ Ask a question in Admin', 1, 'Yes! It knows the whole app and answers right away.'],
    ['Look through old emails from Tony', 0, 'You could, but ❓ Ask a question is much quicker. It knows everything in those emails.'],
    ['Wait and ask at the next meeting', 0, 'No need to wait: tap ❓ Ask a question in Admin and it answers right away.'] ] }
]},
facebook: { icon: '📣', title: 'Posting in Facebook groups', mins: 3, steps: [
  { say: 'On posting days you get an email called <b>📣 Facebook today</b>. It lists the groups to post in, with the post already written for you.',
    screen: mail('Ladle &amp; Spoon', '📣 Facebook today: 1 group to post in', '<div class="card"><b>1. Keego Harbor Community</b><div class="quote" style="margin:8px 0">🥣 This week at Ladle &amp; Spoon: Pasta E Fagioli, Chicken Stroganoff… Order by Friday 7 PM for Monday delivery!</div><button class="btn sm" data-t="copy">Copy</button><button class="btn sm" data-t="open">Open Keego Harbor Community</button></div>'), next: true },
  { say: 'On your phone you press and hold the post to copy it. Here, tap <b>Copy</b>.',

// ── Engine ──
var S = null;   // the lesson being done
function home(){
  S = null; window.scrollTo(0, 0);
  var order = DAYS.slice(), first = order.filter(function(d){ return d.date === DAY; })[0];
  if(first) order = [first].concat(order.filter(function(d){ return d !== first; }));
  var h = '';
  var todo = first ? first.lessons.filter(function(k){ return !DONE[k]; }) : [];
  if(first){
    h += '<p style="margin:18px 0 0;font-size:18px">Hi Lia! ' + (todo.length ? 'Here&rsquo;s your practice ' + first.label.replace(/^For/, 'for') + '. It&rsquo;s all pretend: tap anything, nothing gets sent.' : 'You&rsquo;ve done today&rsquo;s practice. Thank you! 🎉 Do any lesson again whenever you like.') + '</p>';
    if(todo.length) h += '<button class="big" onclick="start(\'' + todo[0] + '\')">▶ Start: ' + L[todo[0]].title + '</button>';
  } else {
    h += '<p style="margin:18px 0 0;font-size:18px">Hi Lia! Short practice lessons, a few minutes each. It&rsquo;s all pretend: tap anything, nothing gets sent.</p>';
  }
  order.forEach(function(d){
    h += '<div class="day' + (d === first ? ' now' : '') + '">' + d.label + '</div>';
    d.lessons.forEach(function(k){
      h += '<button class="tile' + (DONE[k] ? ' done' : '') + '" onclick="start(\'' + k + '\')"><span class="ic">' + (DONE[k] ? '✅' : L[k].icon) + '</span>'
        +  '<span class="t">' + L[k].title + '<span class="m">' + (DONE[k] ? 'Done · tap to do again' : 'About ' + L[k].mins + ' min') + '</span></span><span style="color:var(--t3)">›</span></button>';
    });
  });
  h += '<p style="font-size:14px;color:var(--t3);margin-top:22px">Stuck in the real app? Tap ❓ Ask a question in Admin.</p>';
  $('app').innerHTML = h;
}
function start(k){
  S = { k: k, i: 0, right: 0, total: 0, missed: [], t0: Date.now(), st: {} };
  step();
}
function step(){
  var L1 = L[S.k], s = L1.steps[S.i];
  S.st = S.st || {}; S.tries = 0;
  if(!s) return finish();
  var pct = Math.round(S.i / L1.steps.length * 100);
  var h = '<div class="bar"><button class="x" onclick="home()">✕</button><div class="dots"><i style="width:' + pct + '%"></i></div><span style="font-size:13px;color:var(--t3)">' + (S.i + 1) + '/' + L1.steps.length + '</span></div>';
  if(s.quiz){
    h += '<div class="say">🤔 ' + s.quiz + '</div>' + s.opts.map(function(o, i){ return '<button class="opt" data-o="' + i + '">' + o[0] + '</button>'; }).join('') + '<div id="why"></div><div id="nx"></div>';
    $('app').innerHTML = h; window.scrollTo(0, 0);
    S.total++; var first = true;
    Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        var o = s.opts[+b.dataset.o];
        if(o[1]){
          b.className = 'opt right'; if(first) S.right++;
          $('why').innerHTML = '<div class="why g">✅ ' + o[2] + '</div>';
          $('nx').innerHTML = '<button class="big" onclick="nextStep()">Next</button>';
          Array.prototype.forEach.call(document.querySelectorAll('.opt'), function(x){ x.onclick = null; });
        } else {
          b.className = 'opt wrong';
          if(first) S.missed.push(s.quiz.replace(/<[^>]+>/g, '').replace(/&rsquo;/g, '\'').replace(/&ldquo;|&rdquo;/g, '"').replace(/&amp;/g, '&'));
          $('why').innerHTML = '<div class="why b">Not quite. ' + o[2] + ' Try again.</div>';
        }
        first = false;
      };
    });
    return;
  }
  h += '<div class="say">' + s.say + '</div><div class="hint" id="hint"></div>';
  if(s.run === 'reorder') return runReorder(h);
  if(s.run === 'receipt') return runReceipt(h);
  if(s.screen) h += scr(typeof s.screen === 'function' ? s.screen(S.st) : s.screen);
  if(s.next) h += '<button class="big" onclick="nextStep()">Next</button>';
  $('app').innerHTML = h; window.scrollTo(0, 0);
  if(s.tap) armTap(s);
}
// The button to tap glows; a tap anywhere else in the pretend screen gets a gentle nudge.
function armTap(s){
  var el = document.querySelector('#scr [data-t="' + s.tap + '"]');
  if(el) el.classList.add('glow');
  $('scr').onclick = function(e){
    var t = e.target.closest('[data-t]');
    if(t && t.dataset.t === s.tap){
      if(s.times && (S.st.n = (S.st.n || 0) + 1) < s.times){ var keep = S.st.n; step(); S.st.n = keep; $('hint').textContent = (s.times - keep) + ' more…'; return; }
      S.st.n = 0;
      if(s.after){ $('hint').innerHTML = '<span class="ok">' + s.after + '</span>'; $('scr').onclick = null; setTimeout(nextStep, 900); }
      else nextStep();
      return;
    }
    if(++S.tries >= 1){ $('hint').textContent = '👆 Tap the glowing one'; if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
  };
}
function nextStep(){ S.i++; step(); }

function runReorder(h){
  var st = S.st; st.stops = st.stops || STOPS0.slice();
  function draw(){
    var ann = st.stops.map(function(s){ return s[0]; }).indexOf('Ann Testing');
    $('app').innerHTML = h + scr(routeList(st.stops, ann < 4)) + (ann <= 1 ? '<div class="why g">✅ Ann is stop ' + (ann + 1) + ' now. She&rsquo;ll have her soup well before 11.</div><button class="big" onclick="nextStep()">Next</button>' : '');
    var annRow = document.querySelectorAll('#scr .stop')[ann];
    if(ann > 1 && annRow) annRow.querySelector('[data-mv$=",-1"]').classList.add('glow');
    Array.prototype.forEach.call(document.querySelectorAll('#scr [data-mv]'), function(b){
      b.onclick = function(e){
        e.stopPropagation();
        var p = b.dataset.mv.split(','), i = +p[0], j = i + (+p[1]);
        if(j < 0 || j >= st.stops.length) return;
        var t = st.stops[i]; st.stops[i] = st.stops[j]; st.stops[j] = t; draw();
      };
    });
  }
  draw(); window.scrollTo(0, 0);
}
function runReceipt(h){
  $('app').innerHTML = h + scr('<div class="pad"><b>Re: 🛒 Receipts for your Oct 12 delivery</b><div style="font-size:13px;color:var(--t3);margin:4px 0 8px">📷 1 photo attached</div><textarea id="rc" placeholder="Groceries 182.40"></textarea><button class="btn" id="rcgo">See what the app reads</button><div id="rcout"></div></div>');
  $('rcgo').onclick = function(){
    var r = readReply($('rc').value), good = r.filter(function(x){ return x.ok; }).length;
    $('rcout').innerHTML = (r.length ? r.map(function(x){ return '<div class="rd">' + (x.ok ? '✅ ' : '⚠️ ') + esc(x.t) + '</div>'; }).join('') : '<div class="rd">⚠️ Type at least one line, like “Groceries 182.40”, or “none”.</div>')
      + (good ? '<div class="why g" style="margin-top:10px">That&rsquo;s exactly how to do it. ' + (good === r.length ? '' : 'Lines with ⚠️ wouldn&rsquo;t count. ') + '</div><button class="big" onclick="nextStep()">Next</button>' : '');
  };
  window.scrollTo(0, 0);
}

function finish(){
  var L1 = L[S.k];
  DONE[S.k] = true; store('learn_done', DONE);
  var day = DAYS.filter(function(d){ return d.lessons.indexOf(S.k) >= 0; })[0];
  var nextK = day ? day.lessons.filter(function(k){ return !DONE[k]; })[0] : null;
  var h = '<div style="text-align:center;margin-top:24px"><div style="font-size:56px">🎉</div><div class="say" style="font-family:\'Cormorant Garamond\',serif;font-size:30px;color:var(--f);font-weight:700;margin:0">Done!</div>'
    + '<div style="color:var(--t2)">' + L1.title + (S.total ? ' · ' + S.right + ' of ' + S.total + ' right first try' : '') + '</div></div>'
    + '<div class="say" style="margin-top:22px">How did that feel?</div><div class="feel">'
    + [['good', '😀', 'Easy'], ['ok', '😐', 'OK'], ['hard', '😕', 'Confusing']].map(function(f){ return '<button data-f="' + f[0] + '"><b>' + f[1] + '</b>' + f[2] + '</button>'; }).join('') + '</div>'
    + '<div class="say" style="font-size:18px;margin-top:16px">Anything confusing, or a question for Tony? <span style="color:var(--t3);font-size:15px">(optional)</span></div>'
    + '<textarea id="note" placeholder="Type here…"></textarea>'
    + '<button class="big" id="fin">' + (nextK ? 'Send, and go to the next lesson' : 'Send and finish') + '</button>';
  $('app').innerHTML = h; window.scrollTo(0, 0);
  var feel = '';
  Array.prototype.forEach.call(document.querySelectorAll('.feel button'), function(b){
    b.onclick = function(){ feel = b.dataset.f; Array.prototype.forEach.call(document.querySelectorAll('.feel button'), function(x){ x.className = x === b ? 'on' : ''; }); };
  });
  $('fin').onclick = function(){
    send({ type: 'learn_result', lesson: S.k, right: S.right, total: S.total, missed: S.missed, feel: feel, note: $('note').value.trim(), secs: Math.round((Date.now() - S.t0) / 1000) });
    if(nextK) start(nextK); else home();
  };
}
// Results wait on the phone until they reach the backend (a dead spot in the car is fine).
function send(r){
  if(PREVIEW) return;
  var q = store('learn_queue') || []; q.push(r); store('learn_queue', q); flush();
}
function flush(){
  var q = store('learn_queue') || []; if(!q.length) return;
  var r = q[0];
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(r), keepalive: true })
    .then(function(x){ return x.json(); })
    .then(function(d){ if(d && d.success !== false || (d && /Unknown lesson/.test(d.error || ''))){ var q2 = store('learn_queue') || []; q2.shift(); store('learn_queue', q2); flush(); } })
    .catch(function(){});
}
if(PREVIEW) $('pv').innerHTML = '<div class="pv">Preview: your answers aren&rsquo;t sent to anyone.</div>';
home(); flush();
</script>
</body>
</html>
