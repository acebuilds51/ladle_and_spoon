<!-- Tiny share/landing page.
     og:image is served from THIS domain on purpose. Facebook's crawler repeatedly
     failed to pull the same image from Cloudinary (tags scraped fine, picture came
     back blank); a same-origin image removes that variable entirely. Link scrapers (iMessage, RCS, Facebook) read these
     tags without running JavaScript; real visitors get redirected to the app
     immediately by the script at the bottom. Exists because the main index.html
     is ~4.5MB and some scrapers give up before reaching its <head>.
     No og:url on purpose. It used to name plain share.html, and Facebook files every link under
     its og:url: share.html?src=…&w=<this week> was treated as share.html and got the preview it
     had saved before the weekly menu pictures (the kitchen; Oct 21 2026). Without it, each week's
     &w= link is its own page to Facebook and is read fresh. (Never point it at index.html: some
     scrapers would fetch that big file and give up.) -->
<meta property="og:site_name" content="Ladle &amp; Spoon">
<meta property="og:title" content="Ladle &amp; Spoon — This Week's Menu">
<meta property="og:description" content="This week: Chicken Pot Pie, Cheddar Cauliflower, Garden Tortellini and Beet &amp; Goat Cheese Salad. Homemade in Waterford, delivered Monday. Order by Friday 7 PM.">

<meta property="og:image:width" content="1200">

<script>
  // Send real visitors straight to the app. Scrapers never execute this, so they
  // keep the meta tags above. replace() avoids leaving this page in history.
  // Keep the query string: share.html?src=waterfordhappenings is how the app credits
  // a new customer to the post that brought them (Acquisition sheet). Dropping it
  // recorded every one of them as "unknown".
  location.replace('https://acebuilds51.github.io/ladle_and_spoon/' + location.search);
</script>
